<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SARAVANAKUMAR K — Architectural Portfolio</title>
    <meta
      name="description"
      content="Architectural Portfolio of Saravanakumar K, Graduate Architect. Architecture Shaped by Place."
    />
    <!-- Typography: Archivo, Martian Mono, Cormorant Garamond, DM Mono, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Martian+Mono:wdth,wght@100..112,300..600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Anti-FOUC: Read saved theme from localStorage synchronously.
      Light is the default — new visitors always see the warm-paper editorial theme.
      The React useTheme hook will reconcile state after hydration.
    -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('saravana-arch-theme');
          if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
